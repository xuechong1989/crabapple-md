[package]
name = "crabapple-md"
version = "0.4.0"
description = "crabapple-md — a lightweight Markdown editor built with Tauri 2"
authors = ["xuechong"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "crabapple_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
